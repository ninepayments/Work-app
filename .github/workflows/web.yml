name: Deploy web app
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml', 'tools/smoke/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 회귀 점검 (모든 화면을 열어 오류가 있으면 배포하지 않음)
        run: |
          npm i --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node tools/smoke/web-smoke.js
      - name: Stamp file versions (서버 임시 보관을 피해 새 파일을 바로 받게)
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|; s|href=\"style.css\"|href=\"style.css?v=$V\"|" web/index.html
          grep -n "?v=$V" web/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: dep
        uses: actions/deploy-pages@v4
