name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.github/workflows/cleanup-releases.yml', 'web/**', '.github/workflows/web.yml', 'tools/**', '.github/workflows/backup.yml', '*.md', 'pc/**', '.github/workflows/pc.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read version and check manual/changelog
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VER=$VER" >> $GITHUB_ENV
          grep -q "{\"$VER\"," app/src/main/java/kr/todanjeon/workapp/MainActivity.java || { echo "CHANGELOG 에 $VER 항목이 없습니다"; exit 1; }
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk WorkApp_v${VER}.apk
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-test
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: WorkApp_v${{ env.VER }}.apk
          name: 나인패밀리 v${{ env.VER }} 시험판
          body_path: RELEASE_NOTES.md
