name: Build PC installer
# 윈도우용 설치 파일(나인패밀리 설치 .exe)을 만들어 'pc-v버전' 릴리스에 올린다. pc/ 를 고치거나 직접 실행할 때만 돈다.
on:
  push:
    branches: [main]
    paths: ['pc/**', '.github/workflows/pc.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build installer
        working-directory: pc
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run dist
          echo "VER=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          V=$(node -p "require('./package.json').version")
          cp dist/NineFamily-Setup.exe "dist/NineFamily-Setup-$V.exe" # 받는 사람이 버전을 알아보게 (고정 이름은 최신 받기·자동 업데이트용)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: 나인패밀리 PC 설치 파일 v${{ env.VER }}
          files: |
            pc/dist/NineFamily-Setup.exe
            pc/dist/NineFamily-Setup-${{ env.VER }}.exe
          make_latest: true
          body: |
            윈도우 PC용 나인패밀리 설치 파일입니다. 받아서 실행하면 바탕화면과 시작 메뉴에 '나인패밀리'가 생겨요.
            처음 실행할 때 'Windows의 PC 보호' 창이 뜨면 '추가 정보' → '실행'을 눌러 주세요(회사 서명 인증서가 없어서 나오는 안내예요).
            화면과 기능은 웹앱과 같고, 웹을 고치면 다시 설치하지 않아도 바로 바뀝니다.
