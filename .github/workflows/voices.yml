name: Make voice files
# 알림 음성 파일(한국어)을 만들어 저장소에 넣는다. 손으로만 실행. 문구를 바꿀 때 다시 실행.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install edge-tts==6.1.12 gTTS==2.5.4
          mkdir -p web/snd app/src/main/res/raw
          # 밝은 여자 목소리(ko-KR-SunHiNeural). 안 되면 gTTS 로 대신 만든다.
          make() { # 파일이름 문구 말빠르기 음높이
            edge-tts --voice ko-KR-SunHiNeural --rate="$3" --pitch="$4" --text "$2" --write-media raw.mp3 \
              || python -c "import sys; from gtts import gTTS; gTTS(sys.argv[1], lang='ko').save('raw.mp3')" "$2"
            # 앞뒤 무음 자르고 조금 크게
            ffmpeg -y -loglevel error -i raw.mp3 -af "silenceremove=start_periods=1:start_threshold=-45dB,areverse,silenceremove=start_periods=1:start_threshold=-45dB,areverse,volume=1.4" -ar 24000 -b:a 64k web/snd/$1.mp3
            cp web/snd/$1.mp3 app/src/main/res/raw/$1.mp3
            echo "$1 $2"
          }
          make snd_talk '나인톡!' '+8%' '+25Hz'
          make snd_task '업무가 배정되었습니다' '+0%' '+10Hz'
          make snd_preq '물품요청이 들어왔습니다' '+0%' '+10Hz'
          make snd_ship '물품이 발송되었습니다' '+0%' '+10Hz'
          make snd_notice '새 공지가 있습니다' '+0%' '+10Hz'
          rm -f raw.mp3
          ls -la web/snd app/src/main/res/raw
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/snd app/src/main/res/raw
          git commit -m "알림 음성 파일 만들기 (gTTS)" || echo "바뀐 것 없음"
          git push
