<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;overflow:hidden;user-select:none;font-family:'Malgun Gothic',sans-serif}
#w{position:absolute;left:8px;top:10px;width:104px;height:104px;border-radius:22px;background:#1f1a12;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer}
#w img{width:52px;height:52px;border-radius:12px;pointer-events:none}
#w span{color:#fff;font-size:12px;font-weight:700;pointer-events:none}
#b{position:absolute;right:2px;top:2px;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:11px;background:#d93025;color:#fff;font-size:12px;font-weight:700;line-height:22px;text-align:center;display:none}
</style></head>
<body title="더블클릭하면 나인패밀리가 다시 열려요 · 끌어서 옮기기">
<!-- 창 최소화 때 화면 구석에 뜨는 바로가기 아이콘: 끌어서 옮기고, 더블클릭하면 다시 전체 모드로 연다. 안 읽은 개수(업무+채팅+공지)는 빨간 숫자 -->
<div id="w"><img src="res/icon.png" alt=""><span>나인패밀리</span></div><div id="b"></div>
<script>
const w = document.getElementById('w'), b = document.getElementById('b');
let down = null, moved = false;
w.addEventListener('mousedown', e => { if (e.button !== 0) return; down = {x: e.screenX, y: e.screenY}; moved = false; });
window.addEventListener('mousemove', e => {
  if (!down) return; const dx = e.screenX - down.x, dy = e.screenY - down.y;
  if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
  moved = true; down = {x: e.screenX, y: e.screenY}; window.nineWidget.move(dx, dy);
});
window.addEventListener('mouseup', () => { down = null; });
w.addEventListener('dblclick', () => window.nineWidget.open());
window.nineWidget.onBadge(n => { b.textContent = n > 99 ? '99+' : String(n); b.style.display = n > 0 ? 'block' : 'none'; });
</script></body></html>
